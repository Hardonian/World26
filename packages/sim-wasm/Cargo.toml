[package]
name = "world26-sim-wasm"
version = "1.0.0"
edition = "2021"
authors = ["WORLD//26 Team"]
description = "WebAssembly bindings for WORLD//26 system dynamics simulation engine"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
world26-sim-core = { path = "../sim-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
