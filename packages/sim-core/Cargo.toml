[package]
name = "world26-sim-core"
version = "1.0.0"
edition = "2021"
authors = ["WORLD//26 Team"]
description = "High-performance scientific system dynamics simulation engine for WORLD//26"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_pcg = "0.3"

[dev-dependencies]
criterion = "0.5"

[lib]
name = "world26_sim_core"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]
